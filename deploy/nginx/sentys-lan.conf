# nginx — interface Sentys sur le réseau local (HTTPS)
# Le tunnel public (Tailscale Funnel) cible directement 127.0.0.1:${PUBLIC_PORT} et ne passe pas par ce fichier.
# Installation : /etc/nginx/sites-available/sentys → lien dans sites-enabled → nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name sentys.lan 192.168.0.47;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sentys.lan 192.168.0.47;

    # certificat local (CA domestique / mkcert) — un certificat auto-signé force les utilisateurs
    # à ignorer les avertissements : préférer une CA locale installée sur les appareils
    ssl_certificate     /etc/ssl/sentys/sentys.crt;
    ssl_certificate_key /etc/ssl/sentys/sentys.key;

    # TLS 1.2 minimum, 1.3 privilégié (recommandations ANSSI / CCB)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SentysTLS:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;

    # les en-têtes de sécurité (CSP, HSTS, X-Frame-Options…) sont posés par l'application

    # journal sans chaîne de requête (URLs vidéo signées)
    log_format sentys_noquery '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/sentys.access.log sentys_noquery;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # flux HLS : pas de mise en tampon (latence)
    location /hls/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
}
