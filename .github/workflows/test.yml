name: Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# moindre privilège : lecture seule du dépôt
permissions:
  contents: read

# Actions épinglées par SHA de commit (tag entre parenthèses) — mises à jour par Dependabot
jobs:
  test-client:
    name: Test Client (Frontend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies (lockfile strict)
        run: npm ci

      - name: Check types (TypeScript, projets référencés)
        run: npx tsc -b --noEmit

      - name: Run linter
        run: npm run lint --if-present

      - name: Run unit tests
        run: npm run test --if-present -- --pool=forks --file-parallelism=false
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Build check
        run: npm run build

  test-server:
    name: Test Server (Backend)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: ./server
    # tests d'intégration : migrations et requêtes exécutées sur un vrai PostgreSQL
    # (en local, sans TEST_DATABASE_URL, ils tournent sur PGlite — voir server/test/db.js)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentys_test
          POSTGRES_PASSWORD: sentys_test
          POSTGRES_DB: sentys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentys_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install dependencies (lockfile strict, sans scripts d'installation)
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint --if-present

      - name: Run unit tests
        run: npm run test --if-present -- --pool=forks --file-parallelism=false
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NODE_ENV: "test"
          TEST_DATABASE_URL: "postgres://sentys_test:sentys_test@localhost:5432/sentys_test"

  # CRA annexe I / OWASP A06 : vulnérabilités connues et inventaire des composants
  dependencies:
    name: Audit des dépendances & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: npm audit (production, seuil élevé)
        run: |
          for dir in server client; do
            echo "::group::$dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
            echo "::endgroup::"
          done

      - name: SBOM CycloneDX (npm sbom)
        run: |
          mkdir -p sbom
          (cd server && npm sbom --sbom-format cyclonedx --omit=dev --package-lock-only > ../sbom/sentys-server.cdx.json)
          (cd client && npm sbom --sbom-format cyclonedx --omit=dev --package-lock-only > ../sbom/sentys-client.cdx.json)

      - name: Publier le SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom/
          retention-days: 90

  # ETSI EN 303 645 §5.3 : l'agent distribué aux Pi doit être signé
  agent-signature:
    name: Signature de l'agent Pi
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Vérifier la signature Ed25519
        run: |
          if [ ! -f pi/agent_signing_pub.pem ]; then
            echo "::warning::pi/agent_signing_pub.pem absent : signature non vérifiée (voir pi/sign_agent.sh)"
            exit 0
          fi
          if [ ! -f pi/sentys_agent.py.sig ]; then
            echo "::error::pi/sentys_agent.py.sig manquant : exécuter pi/sign_agent.sh"
            exit 1
          fi
          openssl pkeyutl -verify -pubin -inkey pi/agent_signing_pub.pem -rawin \
            -in pi/sentys_agent.py -sigfile pi/sentys_agent.py.sig

  # aucun secret dans le dépôt ni dans l'historique
  secrets-scan:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
